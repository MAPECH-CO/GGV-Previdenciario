# Barra o PR quebrado (GGVP-118, CA5): typecheck, lint, testes e varredura de segredos.
# Qualquer passo falhando, o job falha. Os testes de tela (Playwright) rodam num job próprio (GGVP-128).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  telas:
    name: Testes de tela (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O Chromium que o próprio Playwright instala, como na máquina de cada dev (kit/entrega-09-10.md).
      - run: pnpm --filter @ggv/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ggv/web exec playwright test --reporter=list,html
      - name: Relatório do Playwright, quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # a ação lista os commits do PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
