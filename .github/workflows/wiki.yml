# Espelha a pasta wiki/ deste repositório na wiki do GitHub a cada push na main.
# A wiki é um git separado (<repo>.wiki.git); o token do próprio Actions tem acesso a ela.
# Regra: a wiki não se edita na aba Wiki. Edita-se wiki/*.md por PR; o merge publica.
# Requisito único: a wiki precisa existir (aba Wiki -> "Create the first page"), o que já foi feito.
name: Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  espelhar:
    name: Publicar wiki/ na wiki do GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Clonar a wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Copiar as páginas (remove da wiki o que saiu da pasta)
        run: |
          rsync -a --delete --exclude '.git' wiki/ /tmp/wiki/

      - name: Enviar
        run: |
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki já estava igual à pasta wiki/."
            exit 0
          fi
          git commit -m "wiki: espelho de ${{ github.repository }}@${GITHUB_SHA::7}"
          git push origin HEAD
