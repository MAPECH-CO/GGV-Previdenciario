# Revisão automática de todo PR pelo Claude, antes da revisão do outro dev.
# Credencial: o segredo CLAUDE_CODE_OAUTH_TOKEN (token da assinatura, gerado com `claude setup-token`).
# Reserva: ANTHROPIC_API_KEY (chave paga por uso). Sem nenhum dos dois, o job termina sem fazer nada.
# Não substitui a revisão humana: o outro dev continua aprovando e mesclando.
name: Revisão automática (Claude)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Claude revisa o PR
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Existe credencial?
        id: chave
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          CHAVE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "chave=$CHAVE" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN" = "true" ]; then echo "usando o token da assinatura";
          elif [ "$CHAVE" = "true" ]; then echo "usando a chave de API";
          else echo "sem credencial: nada a fazer"; fi

      - name: Baixar o repositório
        if: steps.chave.outputs.token == 'true' || steps.chave.outputs.chave == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar (token da assinatura)
        if: steps.chave.outputs.token == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 40
            --setting-sources user
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request em português do Brasil. O PR é de um épico (GGVP-n no título) e cada commit cita uma história. Leia CLAUDE.md, a change em openspec/changes/ citada no PR (uma spec por história em specs/) e as histórias em docs/requisitos/candidatas/ quando existirem.
            Publique o resultado como UM comentário no PR, com `gh pr comment` (a branch do PR já está no diretório atual). Para apontar uma linha específica, use `mcp__github_inline_comment__create_inline_comment` com `confirmed: true`. Não entregue a revisão como mensagem de texto: só como comentário no PR.
            Confira, nesta ordem, e escreva o comentário curto (no máximo 20 linhas), começando por uma destas palavras: BLOQUEIA, ATENÇÃO ou OK.
            1. Escopo: cada commit faz só o que a história que ele cita pede, e todas são do épico do título. Arquivo fora das histórias é BLOQUEIA.
            2. Testes: cada critério de aceite tem teste. Teste que não roda ou não existe é BLOQUEIA.
            3. Campos de formulário: CPF, CEP, data, número, telefone, NB, CNJ e nome usam a biblioteca campos (kit/campos ou packages/campos). Validação solta na tela é ATENÇÃO.
            4. Portões G1 a G22 (docs/requisitos/portoes-governanca.md): validados no servidor, nunca só na tela. Portão contornado é BLOQUEIA.
            5. Regra numérica (prazo, limite, intervalo) é código com teste, nunca texto de modelo.
            6. Segredo, .env, token ou dado real de cliente no diff é BLOQUEIA.
            7. Complexidade: abstração, camada ou dependência que a história não pede é ATENÇÃO, com a linha.
            Cite arquivo e linha em cada ponto. Não elogie. Não repita o diff.

      - name: Revisar (chave de API, reserva)
        if: steps.chave.outputs.token != 'true' && steps.chave.outputs.chave == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 40
            --setting-sources user
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request em português do Brasil. O PR é de um épico (GGVP-n no título) e cada commit cita uma história. Leia CLAUDE.md, a change em openspec/changes/ citada no PR (uma spec por história em specs/) e as histórias em docs/requisitos/candidatas/ quando existirem.
            Publique o resultado como UM comentário no PR, com `gh pr comment` (a branch do PR já está no diretório atual). Para apontar uma linha específica, use `mcp__github_inline_comment__create_inline_comment` com `confirmed: true`. Não entregue a revisão como mensagem de texto: só como comentário no PR.
            Confira, nesta ordem, e escreva o comentário curto (no máximo 20 linhas), começando por uma destas palavras: BLOQUEIA, ATENÇÃO ou OK.
            1. Escopo: cada commit faz só o que a história que ele cita pede, e todas são do épico do título. Arquivo fora das histórias é BLOQUEIA.
            2. Testes: cada critério de aceite tem teste. Teste que não roda ou não existe é BLOQUEIA.
            3. Campos de formulário: CPF, CEP, data, número, telefone, NB, CNJ e nome usam a biblioteca campos (kit/campos ou packages/campos). Validação solta na tela é ATENÇÃO.
            4. Portões G1 a G22 (docs/requisitos/portoes-governanca.md): validados no servidor, nunca só na tela. Portão contornado é BLOQUEIA.
            5. Regra numérica (prazo, limite, intervalo) é código com teste, nunca texto de modelo.
            6. Segredo, .env, token ou dado real de cliente no diff é BLOQUEIA.
            7. Complexidade: abstração, camada ou dependência que a história não pede é ATENÇÃO, com a linha.
            Cite arquivo e linha em cada ponto. Não elogie. Não repita o diff.
