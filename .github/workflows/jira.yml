# Liga o GitHub ao Jira (projeto GGVP) sem depender da automação nativa do Jira.
# 1) PR sem chave GGVP-n no título é reprovado.
# 2) Branch do épico criada -> épico vai para "Em andamento".
#    Push na branch -> cada história citada num commit (feat/fix/test/docs, não wip) vai para "Em análise".
#    PR aberto -> épico vai para "Em análise". PR mesclado -> épico e todas as histórias dos commits vão para "Em homologação".
# Segredos do repositório: JIRA_EMAIL e JIRA_API_TOKEN (conta de serviço ou do administrador).
name: Jira

on:
  create:
  push:
    branches: ['feat/**', 'fix/**']
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read

env:
  JIRA_URL: https://mapech.atlassian.net
  CHAVE_REGEX: 'GGVP-[0-9]+'

jobs:
  chave-no-pr:
    name: Chave GGVP no título do PR
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar título e branch
        env:
          TITULO: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if echo "$TITULO" | grep -Eq "$CHAVE_REGEX"; then
            echo "ok: $TITULO"
          else
            echo "::error::O título do PR precisa trazer a chave do épico, por exemplo 'GGVP-6: Recepção e entrevista'. Título atual: $TITULO"
            exit 1
          fi
          if ! echo "$BRANCH" | grep -Eq "$CHAVE_REGEX"; then
            echo "::warning::A branch '$BRANCH' não tem a chave GGVP-n. Convenção: feat/GGVP-6-recepcao-e-entrevista"
          fi

  transicao:
    name: Mover itens no Jira
    if: (github.event_name == 'create' && github.ref_type == 'branch') || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","ready_for_review","closed"]'), github.event.action))
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório (para ler os commits do push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir chaves e estado alvo
        id: alvo
        env:
          EVENTO: ${{ github.event_name }}
          ACAO: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          TITULO: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          epico=$(printf '%s %s %s' "$TITULO" "$HEAD_REF" "$REF_NAME" | grep -Eo "$CHAVE_REGEX" | head -1 || true)
          chaves=""
          estado=""
          case "$EVENTO:$ACAO" in
            create:)
              chaves="$epico"; estado="Em andamento" ;;
            push:)
              # histórias citadas nos commits da branch que ainda não estão na main; commit wip não conta
              chaves=$(git log --format='%s' origin/main..HEAD 2>/dev/null | grep -Eiv '^wip' | grep -Eo "$CHAVE_REGEX" | grep -v "^$epico$" | sort -u | tr '\n' ' ')
              estado="Em análise" ;;
            pull_request:opened|pull_request:reopened|pull_request:ready_for_review)
              [ "$DRAFT" = "true" ] || { chaves="$epico"; estado="Em análise"; } ;;
            pull_request:closed)
              if [ "$MERGED" = "true" ]; then
                historias=$(gh api "repos/$REPO/pulls/$PR_NUMERO/commits" --paginate --jq '.[].commit.message' | grep -Eiv '^wip' | grep -Eo "$CHAVE_REGEX" | sort -u | tr '\n' ' ')
                chaves="$epico $historias"; estado="Em homologação"
              fi ;;
          esac
          chaves=$(printf '%s' "$chaves" | tr ' ' '\n' | grep -E . | sort -u | tr '\n' ' ')
          echo "chaves=$chaves" >> "$GITHUB_OUTPUT"
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "evento=$EVENTO:$ACAO chaves=${chaves:-nenhuma} estado=${estado:-nenhum}"

      - name: Transicionar no Jira
        if: steps.alvo.outputs.chaves != '' && steps.alvo.outputs.estado != ''
        env:
          CHAVES: ${{ steps.alvo.outputs.chaves }}
          ESTADO: ${{ steps.alvo.outputs.estado }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          url, alvo = os.environ["JIRA_URL"], os.environ["ESTADO"]
          chaves = os.environ["CHAVES"].split()
          auth = "Basic " + base64.b64encode(f"{os.environ['JIRA_EMAIL']}:{os.environ['JIRA_API_TOKEN']}".encode()).decode()
          def api(method, path, body=None):
              req = urllib.request.Request(url + path, data=json.dumps(body).encode() if body else None, method=method,
                    headers={"Authorization": auth, "Content-Type": "application/json", "Accept": "application/json"})
              with urllib.request.urlopen(req) as r:
                  raw = r.read().decode(); return json.loads(raw) if raw else None
          # nomes aceitos por estado alvo: o nome do processo, o nome padrão do Jira em inglês e o que a interface mostra
          equivalentes = {
              "Em andamento": ["Em andamento", "In Progress", "Em desenvolvimento"],
              "Em análise": ["Em análise", "In Review", "Em revisão"],
              "Em homologação": ["Em homologação"],
          }
          aceitos = equivalentes.get(alvo, [alvo])
          for chave in chaves:
              try:
                  st = api("GET", f"/rest/api/3/issue/{chave}?fields=status")["fields"]["status"]
              except urllib.error.HTTPError as e:
                  print(f"::warning::{chave}: não li o item ({e.code})"); continue
              print(f"{chave} está em '{st['name']}'; alvo '{alvo}'")
              if st["name"] in aceitos: print("  já está no estado alvo"); continue
              if st["statusCategory"]["key"] == "done": print("  item concluído não volta"); continue
              if alvo == "Em análise" and st["name"] == "Em homologação": print("  já está em homologação, não volta"); continue
              ts = api("GET", f"/rest/api/3/issue/{chave}/transitions")["transitions"]
              t = next((t for t in ts if t["to"]["name"] in aceitos), None)
              if not t:
                  print(f"::warning::{chave}: não existe transição para '{alvo}' a partir de '{st['name']}'. Disponíveis: {[x['to']['name'] for x in ts]}"); continue
              api("POST", f"/rest/api/3/issue/{chave}/transitions", {"transition": {"id": t["id"]}})
              print(f"  {chave} movido para '{t['to']['name']}'")
          PY
