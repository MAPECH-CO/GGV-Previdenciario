schema: spec-driven

context: |
  Idioma: pt-BR em tudo. Títulos estruturais do OpenSpec e as palavras SHALL/MUST ficam em inglês.
  Projeto: portal operacional do escritório previdenciário GGV, cliente da MAPECH. Regras do repositório em CLAUDE.md; método em kit/LEIA-ME.md.
  Uma change = uma história do Jira GGVP-n. O nome da change começa pela chave em minúsculas: ggvp-27-protocolar-no-meu-inss.
  Fonte da história: docs/requisitos/candidatas/GGVP-n-*.md e o cartão do Jira. Passo BPMN em docs/bpmn/. Portões G1 a G22 em docs/requisitos/portoes-governanca.md. Perfis em docs/requisitos/perfis.md. Telas no Figma, id no texto da história.
  Stack: docs/decisoes/ADR-001 quando existir; até lá, a proposta do CLAUDE.md (TypeScript, Fastify + Zod, Drizzle + PostgreSQL, React + Vite, Vitest, Playwright).
  Prazo: entrega funcionando em 09/10/2026. Menor mudança que cumpre o critério. Nada "para o futuro". Sem subagente.

rules:
  proposal:
    - A primeira linha cita a chave GGVP-n, o passo BPMN e o perfil que usa.
    - Até 300 palavras. Seções fixas: "Por quê", "O que muda", "Fora do escopo" (copiada da história), "Portões envolvidos", "Travas".
    - Critério com [decidir] ou "(proposta)" sem resposta vai em "Travas" e não vira código. Se a trava impede o critério de ser testado, parar e perguntar antes de gerar o resto.
  specs:
    - Um requisito por critério de aceite da história, na ordem da história, com o número do critério no título.
    - Cenários em Dado / Quando / Então, os mesmos da história. Sem cenário inventado.
    - Regra numérica (prazo, limite, intervalo) vira requisito com o valor explícito ou com "parâmetro (Q1)".
  design:
    - Contrato primeiro. O schema Zod de entrada e saída de cada endpoint e de cada formulário, em packages/contratos. Front e back constroem sobre ele e não editam o mesmo arquivo.
    - Campos de formulário. Listar cada campo e a função da biblioteca campos que ele usa (CPF, CEP, data, número, telefone, NB, CNJ, nome, e-mail). Nunca validação solta na tela. O servidor valida de novo com a mesma função.
    - Portão de governança é validado no servidor (GGVP-109). A tela só reflete.
    - Sem abstração nova, camada nova ou dependência nova sem uma linha dizendo por quê.
  tasks:
    - Tarefa de no máximo 2 horas. Cada tarefa diz o arquivo que cria ou muda e o teste que a prova.
    - Ordem: contrato → teste → servidor → tela → teste ponta a ponta com Playwright quando há tela.
    - A última tarefa é sempre "Rodar typecheck, lint, testes e Playwright; colar a saída; perguntar 'Agora ok?'".

operations:
  apply:
    guidance:
      - Uma tarefa por vez, marcando o checkbox. Sem subagente.
      - O teste roda antes de marcar a tarefa. A saída vai na tela. "Passou" sem saída não vale.
      - Ao terminar todas as tarefas, e depois de qualquer ajuste pedido, rodar as verificações e perguntar "Agora ok?". Nunca concluir sozinho. Com o ok, o dev roda /ok.
      - Pedido fora do tasks.md é outra história ou um /opsx:update. Parar e dizer qual.
  archive:
    guidance:
      - Só depois do merge do PR e do "Aceita" do Lucas no Jira.
      - Resumir em 3 linhas o que a spec principal passou a dizer.
