schema: spec-driven

context: |
  Idioma: pt-BR em tudo. Títulos estruturais do OpenSpec e as palavras SHALL/MUST ficam em inglês.
  Projeto: portal operacional do escritório previdenciário GGV, cliente da MAPECH. Regras do repositório em CLAUDE.md; método em kit/LEIA-ME.md; comando em .claude/commands/epico.md.
  Uma change = um épico do Jira (GGVP-n do tipo Epic). Nome: ggvp-6-recepcao-e-entrevista. Dentro dela, uma spec por história em specs/ggvp-<história>/spec.md e uma seção "## GGVP-<história> · título" por história no tasks.md.
  Fonte da história: o cartão do Jira (descrição, critérios, dúvidas abertas e comentários). Cópia em docs/requisitos/candidatas/ quando existir. Passo BPMN em docs/bpmn/. Portões G1 a G22 em docs/requisitos/portoes-governanca.md. Perfis em docs/requisitos/perfis.md. Tela no Figma pelo link do comentário "Links diretos" do cartão.
  Stack: docs/decisoes/ADR-001 quando existir; até lá, a proposta do CLAUDE.md (TypeScript, Fastify + Zod, Drizzle + PostgreSQL, React + Vite, Vitest, Playwright).
  Prazo: entrega funcionando em 09/10/2026. Menor mudança que cumpre o critério. Nada "para o futuro". Sem subagente.

rules:
  proposal:
    - A primeira linha cita o épico (GGVP-n e título), e a lista das histórias na ordem de kit/entrega-09-10.md, cada uma com chave, título e perfil que usa.
    - Até 400 palavras. Seções fixas: "Por quê", "Histórias na ordem", "Fora do escopo", "Portões envolvidos".
    - Só história em "Refinada" no Jira entra na lista. História com dúvida aberta ou [decidir] fica numa seção "Travadas", com a pergunta e quem responde, e não vira código.
  specs:
    - Uma spec por história. Um requisito por critério de aceite, na ordem da história, com o número do critério no título.
    - Cenários em Dado / Quando / Então, os mesmos da história. Sem cenário inventado.
    - Regra numérica (prazo, limite, intervalo) vira requisito com o valor explícito ou com "parâmetro (Q1)".
  design:
    - Contrato primeiro. O schema Zod de entrada e saída de cada endpoint e de cada formulário, em packages/contratos. Front e back constroem sobre ele e não editam o mesmo arquivo.
    - Campos de formulário. Listar cada campo e a função da biblioteca campos que ele usa (CPF, CEP, data, número, telefone, NB, CNJ, nome, e-mail). Nunca validação solta na tela. O servidor valida de novo com a mesma função.
    - Portão de governança é validado no servidor (GGVP-109). A tela só reflete.
    - Sem abstração nova, camada nova ou dependência nova sem uma linha dizendo por quê.
  tasks:
    - Uma seção "## GGVP-n · título" por história, acrescentada quando a história começa. Tarefa de no máximo 2 horas. Cada tarefa diz o arquivo que cria ou muda e o teste que a prova.
    - Ordem dentro da seção: contrato → teste → servidor → tela → teste ponta a ponta com Playwright quando há tela. Tela sem servidor ainda: tarefa "ligar no servidor" fica aberta na seção.
    - A última tarefa de cada seção é sempre "Rodar typecheck, lint, testes e Playwright; colar a saída; perguntar 'Agora ok?'".

operations:
  apply:
    guidance:
      - Uma história por vez, uma tarefa por vez, marcando o checkbox. Sem subagente.
      - O teste roda antes de marcar a tarefa. A saída vai na tela. "Passou" sem saída não vale.
      - Ao terminar a seção da história, e depois de qualquer ajuste pedido, rodar as verificações e perguntar "Agora ok?". Nunca concluir sozinho. Com o ok, o /epico commita com a chave da história, sobe e move o cartão.
      - Pedido fora da história atual é outra história do épico, ou outro épico. Parar e dizer qual.
  archive:
    guidance:
      - Só depois do merge do PR do épico e do "Aceita" do Lucas em todas as histórias dele.
      - Resumir em 3 linhas o que a spec principal passou a dizer.
